<body>
<style>
/* Contenedor principal horizontal */
.navbar-horizontal {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    padding: 5px 5%; /* Reducido de 20px a 5px para que sea delgada */
    background-color: #fff;
    
    margin-bottom: 0px; /* Aseguramos que no empuje lo de abajo */
}
.navbar-custom {
    display: flex;
    justify-content: space-between; /* Logo a la izq, Menú a la der */
    align-items: center;
    padding: 10px 5%;
    background-color: #fff;
    position: relative; /* Importante para el buscador absoluto */
    min-height: 80px;
}
/* Secciones individuales */
.nav-section {
    display: flex;
    align-items: center;
}

/* Estilo del Logo */
.logo-circular {
    width: 60px; /* Un poco más pequeño ayuda a subir todo */
    
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
    object-fit: cover;
}
/* Buscador Estilizado */
.search-bar {
  position: relative; /* OBLIGATORIO */
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 40px;
    padding: 2px 15px; /* Menos relleno interno */
    box-shadow: 0 4px 12px rgba(166, 43, 177, 0.15);
    border: 1px solid #eee;
    width: 400px;
    margin: 0 auto;
}

.search-input {
    border: none;
    outline: none;
    width: 100%;
    padding: 8px;
    font-size: 14px;
}

.search-btn {
    background: #a62bb1;
    border: none;
    border-radius: 50%;
    width: 34px;
    
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
}

.search-btn svg {
    width: 16px;
    fill: #00e5ff;
}

/* Menú Horizontal */
.nav-menu {
    display: flex; /* Hace que el menú sea horizontal */
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 20px; /* Espacio entre palabras */
}

.nav-menu li a {
    text-decoration: none;
    color: #a62bb1; /* Morado como tus botones */
    font-weight: 500;
    transition: 0.3s;
}

.nav-menu li a:hover {
    color: #ff00ff;
}
/* 4. IMPORTANTE: El contenedor del contenido de abajo */
/* Asegúrate de que lo que sigue después del nav no tenga un margin-top gigante */
.container, .main-content {
    margin-top: 10px !important; 
    padding-top: 0px !important;
}
/* Contenedor de resultados para que flote sobre el contenido */
#resultados {
    position: absolute; /*este deja la posicion del buscador central*/
    top: 13%; /* Esto lo pone justo debajo del buscador */
    left: auto; /* Lo movemos al centro */
    flex-wrap: nowrap;       /* OBLIGATORIO: prohíbe que el menú se baje */
    /* width: 100% !important;  Se ajusta al mismo ancho del buscador */
    background: white;/* este sirve para darle el color debajo cuando se busca algo */
    border-radius: 0 0 15px 15px; /* Redondeado solo abajo para que encaje */
    box-shadow: 0 10px 25px rgba(62, 11, 66, 0.2);
    z-index: 1000; /* Para que pase por encima de las letras de "Descansa..." */
    margin-top: 2px;/* Pequeño espacio para que no esté pegado */
    overflow: hidden;
    padding: 0;
    border: 1px solid #fcf9f9;
}

/* La tarjeta de cada producto */
.resultado-card {
    padding: 12px 15px;
    border-bottom: 1px solid #fff0f6;
    transition: all 0.3s ease;
    cursor: pointer;
}

.resultado-card:hover {
    background-color: #fdf5ff; /* Color lila muy suave al pasar el mouse */
}

/* Cambiamos el azul por tu morado de marca */
.resultado-card h4 a {
   color: #ff1493 !important; /* Rosa fuerte (Deep Pink) */
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
}
.resultado-card h4 a:hover {
    color: #ff00ff !important; /* Rosa cuando lo tocas */
}

.resultado-card p {
    color: #888;
    font-size: 0.85rem;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.no-results {
    padding: 15px;
    color: #999;
    text-align: center;
}
/* Para que esto funcione, el contenedor del buscador debe tener: */
.search-container {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}
/* Cambiamos el color azul por tu morado elegante */
.resultado-card h4 a {
    color: #a62bb1 !important;
    text-decoration: none;
    font-size: 1.1rem;
    transition: color 0.3s;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".card[data-link]").forEach(card => {
        card.style.cursor = "pointer";
        card.addEventListener("click", function () {
            window.location.href = this.dataset.link;
        });
    });
});
async function buscar(e) {
    e.preventDefault();
    
    let query = document.getElementById("searchInput").value.toLowerCase();
    let contenedor = document.getElementById("resultados");
    
    // Si el buscador está vacío, limpiamos y no hacemos nada
    if (query.trim() === "") {
        contenedor.innerHTML = "";
        return;
    }

    let response = await fetch("static/datos.json");
    let datos = await response.json();

    let resultados = datos.filter(item =>
        item.titulo.toLowerCase().includes(query) ||
        item.descripcion.toLowerCase().includes(query)
    );

    contenedor.innerHTML = "";

    if(resultados.length === 0){
        contenedor.innerHTML = "<div class='no-results'>No se encontraron resultados</div>";
        return;
    }

    // AQUÍ ESTÁ EL CAMBIO PRINCIPAL:
    resultados.forEach(item => {
        contenedor.innerHTML += `
            <div class="resultado-card">
                <div class="resultado-info">
                    <h4><a href="${item.url}">${item.titulo}</a></h4>
                    <p>${item.descripcion}</p>
                </div>
            </div>
        `;
    });
}
</script>
